<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Winnow</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 300px;
      margin: 0;
      font-family: Roboto, Arial, sans-serif;
      font-size: 13px;
      color: #0f0f0f;
      background: #fff;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #f1f1f1; background: #212121; }
      .row { border-color: #3a3a3a !important; }
      .stat-box { background: #2c2c2c !important; }
      button.secondary { border-color: #555 !important; color: #f1f1f1 !important; }
    }
    header {
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header .logo { font-size: 18px; }
    header h1 { font-size: 15px; margin: 0; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-top: 1px solid #ececec;
    }
    .row label { flex: 1; margin-right: 10px; }
    .row small { display: block; color: #707070; font-weight: normal; }
    .section-title {
      padding: 10px 16px 2px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #909090;
    }
    .switch { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #ccc; border-radius: 20px; transition: 0.15s; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.15s; }
    input:checked + .slider { background-color: #1e5631; }
    input:checked + .slider:before { transform: translateX(16px); }
    .stats { display: flex; padding: 12px 16px; gap: 8px; }
    .stat-box { flex: 1; background: #f7f7f7; border-radius: 8px; padding: 8px; text-align: center; }
    .stat-box .num { font-size: 16px; font-weight: 600; }
    .stat-box .label { font-size: 10px; color: #707070; }
    footer { padding: 10px 16px 16px; }
    button.secondary {
      width: 100%; padding: 8px; border-radius: 18px; border: 1px solid #ccc;
      background: none; cursor: pointer; font-size: 12px; color: #0f0f0f;
    }
    .warn-row { background: #fff8e1; }
    @media (prefers-color-scheme: dark) { .warn-row { background: #3a3315; } }
    #se-modal {
      display: none;
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      align-items: center; justify-content: center; padding: 16px;
    }
    #se-modal .card {
      background: #fff; color: #0f0f0f; border-radius: 10px; padding: 16px; font-size: 13px;
    }
    @media (prefers-color-scheme: dark) { #se-modal .card { background: #2c2c2c; color: #f1f1f1; } }
    #se-modal .actions { display: flex; gap: 8px; margin-top: 12px; }
    #se-modal button { flex: 1; padding: 8px; border-radius: 16px; border: 1px solid #ccc; cursor: pointer; background: none; color: inherit; }
    #se-modal button.confirm { background: #c0392b; color: #fff; border: none; }
  </style>
</head>
<body>
  <header>
    <span class="logo">🧹</span>
    <h1>Winnow</h1>
  </header>

  <div class="row">
    <label>Enabled on this site<small>Master on/off</small></label>
    <label class="switch">
      <input type="checkbox" id="masterEnabled" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="section-title">Categories</div>
  <div class="row">
    <label>Engagement farming</label>
    <label class="switch"><input type="checkbox" id="cat-engagement_farm" /><span class="slider"></span></label>
  </div>
  <div class="row">
    <label>Promo / link spam</label>
    <label class="switch"><input type="checkbox" id="cat-promo_link" /><span class="slider"></span></label>
  </div>
  <div class="row">
    <label>Financial / crypto scam chains</label>
    <label class="switch"><input type="checkbox" id="cat-finance_chain" /><span class="slider"></span></label>
  </div>
  <div class="row">
    <label>Off-topic (report-only)<small>Never auto-hidden — just collected</small></label>
    <label class="switch"><input type="checkbox" id="cat-offtopic" /><span class="slider"></span></label>
  </div>

  <div class="section-title">Scorched Earth</div>
  <div class="row warn-row">
    <label>Scorched Earth mode<small>Blocks candidates, lowers threshold, nukes reply chains</small></label>
    <label class="switch"><input type="checkbox" id="scorchedEarth" /><span class="slider"></span></label>
  </div>

  <div class="stats">
    <div class="stat-box"><div class="num" id="stat-hidden">0</div><div class="label">hidden this week</div></div>
    <div class="stat-box"><div class="num" id="stat-reports">0</div><div class="label">reports contributed</div></div>
    <div class="stat-box"><div class="num" id="stat-version">v0</div><div class="label">blocklist version</div></div>
  </div>

  <footer>
    <button class="secondary" id="open-options">Options</button>
  </footer>

  <div id="se-modal">
    <div class="card">
      <strong>Turn on Scorched Earth mode?</strong>
      <p>This will hide legitimate comments. It blocks unverified candidate accounts, lowers the detection threshold, and removes entire reply chains.</p>
      <div class="actions">
        <button id="se-cancel">Cancel</button>
        <button class="confirm" id="se-confirm">Enable anyway</button>
      </div>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
