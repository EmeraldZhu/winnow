name: CI

on:
  pull_request:
    branches: [master dev]
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [master dev]


permissions:
  contents: read

jobs:
  pr-format:
    name: PR follows template
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Run the checker from master, so a pull request cannot loosen its own check.
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check description
        run: |
          if [ -f .github/scripts/check-pr.js ]; then
            node .github/scripts/check-pr.js
          else
            echo "Checker not on the base branch yet; skipping."
          fi


  validate:
    name: Validate extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JSON files parse
        run: |
          for f in extension/manifest.json extension/src/rules.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1
          done
      - name: JS syntax
        run: for f in extension/src/*.js; do node --check "$f" || exit 1; done

  master-from-dev-only:
    name: Master only accepts dev
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "PRs into master must come from dev."; exit 1
          fi



  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: |
          if ls tests/*.test.js >/dev/null 2>&1; then
            node --test tests/*.test.js
          else
            echo "No tests on this branch."
          fi
